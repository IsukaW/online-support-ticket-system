version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: ticket-system-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: ticket-system
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - ticket-system-network

  # Backend API Service
  backend:
    build: .
    container_name: ticket-system-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/ticket-system?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL}
    depends_on:
      - mongodb
    networks:
      - ticket-system-network
    volumes:
      - ./uploads:/usr/src/app/uploads

volumes:
  mongodb_data:

networks:
  ticket-system-network:
    driver: bridge
